{% extends 'base.html' %}{% block c %}<div class="top"><div><h1>Maestro de Equipos</h1><p>Tipo de equipo → Marca → Modelo → Despiece.</p></div></div><div class="panel"><h2>Nuevo modelo</h2><form method="post" class="grid3"><label>Tipo<input name="tipo" value="Bomba centrífuga" required></label><label>Marca<input name="marca" required placeholder="Ej. Gorman-Rupp"></label><label>Modelo<input name="modelo" required placeholder="Ej. T10"></label><button class="wide">Crear modelo</button></form></div><table><tr><th>Tipo</th><th>Marca</th><th>Modelo</th><th>Componentes</th></tr>{% for m in modelos %}<tr><td>{{m.tipo}}</td><td>{{m.marca}}</td><td><a href="{{url_for('maestro_modelo',mid=m.id)}}"><b>{{m.modelo}}</b></a></td><td>{{m.componentes|length}}</td></tr>{% endfor %}</table>{% endblock %}
