{% extends 'base.html' %}{% block c %}<h1>{{'Modificar usuario' if usuario else 'Crear usuario'}}</h1><div class="card form-card"><form method="post"><div class="grid2"><div><label>Nombre completo</label><input name="nombre" value="{{usuario.nombre if usuario else ''}}" required></div><div><label>Cargo</label><input name="cargo" value="{{usuario.cargo if usuario else ''}}" placeholder="Ej.: Técnico mecánico"></div><div><label>RUT</label><input name="rut" value="{{usuario.rut if usuario else ''}}"></div><div><label>Correo</label><input type="email" name="email" value="{{usuario.email if usuario else ''}}"></div><div><label>Sigla de planificación</label><input name="sigla" maxlength="10" value="{{usuario.sigla if usuario else ''}}" placeholder="Ej.: PV"><small>No puede repetirse.</small></div><div><label>Color de planificación</label><input type="color" name="color" value="{{usuario.color if usuario and usuario.color else '#0b6596'}}"><small>No puede repetirse entre usuarios.</small></div>{% if not usuario %}<div><label>Usuario</label><input name="username" required></div>{% else %}<div><label>Usuario</label><input value="{{usuario.username}}" disabled></div>{% endif %}<div><label>{{'Nueva contraseña (opcional)' if usuario else 'Contraseña inicial'}}</label><input type="password" name="password" minlength="8" {{'' if usuario else 'required'}}></div></div><label>Rol</label><select name="rol" id="rol"><option {{'selected' if usuario and usuario.rol=='Usuario' else ''}}>Usuario</option><option {{'selected' if usuario and usuario.rol=='Administrador' else ''}}>Administrador</option></select><h3>Permisos</h3><div class="permission-grid">{% for key,label in permisos.items() %}<label class="check"><input type="checkbox" name="permisos" value="{{key}}" {{'checked' if usuario and key in usuario.permisos else ''}}> {{label}}</label>{% endfor %}</div><button class="btn" type="submit">Guardar usuario</button></form></div>{% endblock %}
