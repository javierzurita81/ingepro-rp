{% extends 'base.html' %}{% block c %}<div class="top"><div><h1>{{'Editar empresa' if cliente else 'Nueva empresa cliente'}}</h1><p>Datos comerciales y tributarios de la empresa.</p></div><a class="btn" href="{{url_for('cliente_ver',cid=cliente.id) if cliente else url_for('clientes')}}">Volver</a></div><form method="post" class="panel grid2"><label>Razón social<input name="nombre" required value="{{cliente.nombre if cliente else ''}}"></label><label>Nombre comercial<input name="nombre_comercial" value="{{cliente.nombre_comercial or '' if cliente else ''}}"></label><label>RUT<input name="rut" required value="{{cliente.rut or '' if cliente else ''}}"></label><label>Giro<input name="giro" value="{{cliente.giro or '' if cliente else ''}}"></label><label class="wide">Dirección comercial<input name="direccion" value="{{cliente.direccion or '' if cliente else ''}}"></label><label>Comuna<input name="comuna" value="{{cliente.comuna or '' if cliente else ''}}"></label><label>Ciudad / Región<input name="ciudad" value="{{cliente.ciudad or '' if cliente else ''}}"></label><label>Teléfono<input name="telefono" value="{{cliente.telefono or '' if cliente else ''}}"></label><label>Correo general<input name="email" type="email" value="{{cliente.email or '' if cliente else ''}}"></label><button class="wide">{{'Guardar cambios' if cliente else 'Guardar empresa'}}</button></form>{% endblock %}
