{% extends 'base.html' %}{% block c %}
<div class="pagehead"><div><h1>Nueva cotización</h1><p>{{ot.numero}} · {{ot.cliente}} · {{ot.equipo}}</p></div></div>
<form method="post" class="quote-layout"><section class="card"><div class="formgrid">
<label>Cliente<input value="{{ot.cliente}}" disabled></label><label>OT<input value="{{ot.numero}}" disabled></label>
<label>Contacto<input name="contacto" placeholder="Nombre del contacto"></label><label>Validez hasta<input type="date" name="validez_hasta"></label>
<label>Plazo de pago<select name="plazo_pago"><option>30 días</option><option>15 días</option><option>45 días</option><option>60 días</option><option>Contado</option></select></label>
<label>Tiempo de ejecución *<div style="display:flex;gap:8px"><input name="plazo_ejecucion_cantidad" type="number" min="1" required placeholder="15" style="max-width:110px"><select name="plazo_ejecucion_unidad" required><option>Días hábiles</option><option>Días corridos</option><option>Semanas</option></select></div></label>
<label class="wide">Inicio del plazo *<select name="inicio_plazo" required><option>Recepción de OC / aprobación</option><option>Recepción física del componente</option><option>Recepción de materiales del cliente</option><option>Fecha acordada con cliente</option></select></label>
<label class="wide">Referencia<input name="referencia" placeholder="Ej: Informe diagnóstico / NT / solicitud cliente"></label></div>
<h2>Líneas de cotización</h2><div class="quote-lines"><table id="lineas"><thead><tr><th>Producto / Servicio</th><th>Cantidad</th><th>Precio unitario</th><th>Importe</th><th></th></tr></thead><tbody>
{% for s in sugerencias %}<tr><td><input name="descripcion[]" value="{{s}}"></td><td><input class="qty" name="cantidad[]" type="number" min="0" step="0.01" value="1"></td><td><input class="price" name="precio[]" type="number" min="0" step="1" value="0"></td><td class="line-total">$ 0</td><td><button type="button" class="iconbtn" onclick="this.closest('tr').remove();calc()">×</button></td></tr>{% endfor %}
<tr><td><input name="descripcion[]" placeholder="Descripción del trabajo"></td><td><input class="qty" name="cantidad[]" type="number" min="0" step="0.01" value="1"></td><td><input class="price" name="precio[]" type="number" min="0" step="1" value="0"></td><td class="line-total">$ 0</td><td><button type="button" class="iconbtn" onclick="this.closest('tr').remove();calc()">×</button></td></tr>
</tbody></table><button type="button" class="linkbtn" onclick="addLine()">+ Agregar producto / servicio</button></div>
<label>Notas / condiciones<textarea name="notas" rows="4" placeholder="Condiciones comerciales, exclusiones, alcance..."></textarea></label></section>
<aside class="card totals"><h3>TOTALES</h3><div><span>Moneda</span><b>CLP</b></div><div><span>Subtotal</span><b id="subtotal">$ 0</b></div><div><span>IVA 19%</span><b id="iva">$ 0</b></div><div class="grand"><span>Total</span><b id="total">$ 0</b></div><button class="btn" name="accion" value="guardar">Guardar presupuesto</button><button class="btn primary" name="accion" value="enviar">Guardar como enviado</button></aside></form>
<script>const money=n=>'$ '+Math.round(n).toLocaleString('es-CL');function calc(){let s=0;document.querySelectorAll('#lineas tbody tr').forEach(r=>{let q=parseFloat(r.querySelector('.qty')?.value||0),p=parseFloat(r.querySelector('.price')?.value||0),v=q*p;s+=v;let x=r.querySelector('.line-total');if(x)x.textContent=money(v)});document.getElementById('subtotal').textContent=money(s);document.getElementById('iva').textContent=money(s*.19);document.getElementById('total').textContent=money(s*1.19)}function addLine(){let b=document.querySelector('#lineas tbody'),r=document.createElement('tr');r.innerHTML='<td><input name="descripcion[]" placeholder="Descripción del trabajo"></td><td><input class="qty" name="cantidad[]" type="number" min="0" step="0.01" value="1"></td><td><input class="price" name="precio[]" type="number" min="0" step="1" value="0"></td><td class="line-total">$ 0</td><td><button type="button" class="iconbtn" onclick="this.closest(\'tr\').remove();calc()">×</button></td>';b.appendChild(r);bind()}function bind(){document.querySelectorAll('.qty,.price').forEach(x=>x.oninput=calc)}bind();calc();</script>{% endblock %}
