{% extends 'base.html' %}{% block c %}<div class="top"><div><h1>{{ot.numero}}</h1><p>{{ot.cliente}} · {{ot.equipo}} · {{ot.componente}}</p></div><span class="tag big">{{ot.estado}}</span></div><div class="steps"><span>1 Ingreso</span><span>2 Diagnóstico</span><span>3 Cotización</span><span>4 Reparación</span><span>5 Calidad</span><span>6 Checklist</span><span>7 Despacho</span></div><form method="post" class="panel wide"><label>Diagnóstico<textarea name="diagnostico" placeholder="Condición de recepción, inspección, mediciones, daños y recomendación...">{{ot.diagnostico or ''}}</textarea></label><label>N° Cotización<input name="cotizacion" value="{{ot.cotizacion or ''}}"></label><label>Aprobación cliente<select name="aprobacion"><option>{{ot.aprobacion}}</option><option>Pendiente</option><option>Aprobada</option><option>Rechazada</option></select></label><label>Reparación / trabajos ejecutados<textarea name="reparacion">{{ot.reparacion or ''}}</textarea></label><label>Control de calidad<textarea name="control_calidad">{{ot.control_calidad or ''}}</textarea></label><label>Checklist físico (referencia)<input name="checklist" value="{{ot.checklist or ''}}" placeholder="Ej. CHK-BOM-01 firmado"></label><label>Embalaje<textarea name="embalaje">{{ot.embalaje or ''}}</textarea></label><label>Despacho<textarea name="despacho">{{ot.despacho or ''}}</textarea></label><label>Estado<select name="estado">{% for e in ['Diagnóstico','Cotización enviada','Aprobada / Reparación','Control de calidad','Checklist / Embalaje','Despachada','Cerrada'] %}<option {% if ot.estado==e %}selected{% endif %}>{{e}}</option>{% endfor %}</select></label><button>Guardar cambios</button></form>{% endblock %}
