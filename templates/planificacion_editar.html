{% extends 'base.html' %}{% block c %}
<div class="pagehead"><div><div class="eyebrow">PROGRAMACIÓN DE MAESTRANZA</div><h1>Modificar actividad</h1><p>{{a.ot.numero}} · {{a.componente.nombre if a.componente else 'Sin componente'}}</p></div></div>
<div class="card form-card"><form method="post"><div class="grid3"><div><label>Tarea</label><input name="tarea" required value="{{a.tarea}}"></div><div><label>Responsable</label><select name="usuario_id" required>{% for u in usuarios %}<option value="{{u.id}}" {{'selected' if u.id==a.usuario_id else ''}}>{{u.sigla or '-'}} · {{u.nombre}}</option>{% endfor %}</select></div><div><label>Estado</label><select name="estado">{% for e in ['Planificada','En ejecución','Terminada','En espera'] %}<option {{'selected' if a.estado==e else ''}}>{{e}}</option>{% endfor %}</select></div><div><label>Fecha inicio</label><input type="date" name="fecha_inicio" required value="{{a.fecha_inicio.isoformat()}}"></div><div><label>Fecha término</label><input type="date" name="fecha_fin" required value="{{a.fecha_fin.isoformat()}}"></div><div><label>Horas por día</label><input type="number" name="horas_dia" min="0.5" max="8" step="0.5" required value="{{a.horas_dia}}"></div></div><label>Observaciones</label><input name="observacion" value="{{a.observacion or ''}}"><div style="display:flex;gap:12px;margin-top:15px"><button class="btn" type="submit">Guardar cambios</button><a class="btn secondary" href="{{url_for('planificacion',mes=a.fecha_inicio.month,anio=a.fecha_inicio.year)}}">Cancelar</a></div></form></div>
{% endblock %}
