{% extends 'base.html' %}{% block c %}<h1>Crear usuario</h1><div class="card form-card"><form method="post"><div class="grid2"><div><label>Nombre completo</label><input name="nombre" required></div><div><label>Cargo</label><input name="cargo" placeholder="Ej.: Técnico mecánico"></div><div><label>Usuario</label><input name="username" required></div><div><label>Contraseña inicial</label><input type="password" name="password" minlength="8" required></div></div><label>Rol</label><select name="rol" id="rol"><option>Usuario</option><option>Administrador</option></select><h3>Permisos</h3><div class="permission-grid">{% for key,label in permisos.items() %}<label class="check"><input type="checkbox" name="permisos" value="{{key}}"> {{label}}</label>{% endfor %}</div><button class="btn" type="submit">Guardar usuario</button></form></div>{% endblock %}
